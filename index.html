<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Workspace</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --bg-card: #252529;
      --accent: #f55036;
      --accent-hover: #e03e25;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --border: #333336;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      background: var(--accent);
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user .avatar {
      background-color: #3b82f6;
      color: white;
    }

    .ai .avatar {
      background-color: var(--accent);
      color: white;
    }

    .content {
      background-color: var(--bg-card);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      line-height: 1.6;
      max-width: 85%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .content {
      background-color: #2b2d35;
    }

    /* Input Footer */
    footer {
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
    }

    .input-box {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      background: var(--bg-primary);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .input-box:focus-within {
      border-color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      height: 24px;
      max-height: 150px;
      outline: none;
      font-family: inherit;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>your assistant  <span>v3.3</span></h1>
  </header>

  <div id="chat-container">
    <div class="message ai">
      <div class="avatar">AI</div>
      <div class="content">Hello! How can I help you today?</div>
    </div>
  </div>

  <footer>
    <div class="input-box">
      <textarea id="userInput" placeholder="Send a message..." rows="1" oninput="autoGrow(this)"></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </footer>

  <script>
    // Paste your key inside API_KEY variable below:
    const API_KEY = "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"; 

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function autoGrow(element) {
      element.style.height = "5px";
      element.style.height = (element.scrollHeight - 16) + "px";
    }

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = role === 'user' ? 'You' : 'AI';

      const content = document.createElement('div');
      content.className = 'content';
      content.innerText = text;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(content);
      chatContainer.appendChild(msgDiv);
      
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return content;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      userInput.style.height = '24px';
      
      sendBtn.disabled = true;
      const aiResponseContent = appendMessage('ai', 'Thinking...');

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [{ role: "user", content: text }]
          })
        });

        const data = await response.json();

        if (response.ok) {
          aiResponseContent.innerText = data.choices[0].message.content;
        } else {
          aiResponseContent.innerText = "Error: " + (data.error?.message || "Failed to process request.");
        }
      } catch (err) {
        aiResponseContent.innerText = "Network error: Unable to reach the service.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    // Allow Enter key to send message (Shift + Enter for new line)
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
