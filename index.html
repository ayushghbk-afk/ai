<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Your Friend - AI Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg-main:#0b1020;
      --bg-sidebar:#0a0f1b;
      --bg-card:#11182a;
      --bg-input:#11182a;
      --text-main:#f4f7ff;
      --text-sub:#a9b4d0;
      --border:rgba(255,255,255,.10);
      --accent:#7c5cff;
      --accent-2:#ff4d8d;
      --accent-3:#26d6a6;
      --warning:#ffcc66;
      --danger:#ff6b6b;
      --shadow: 0 18px 50px rgba(0,0,0,.40);

      --bubble-border: rgba(255,255,255,.10);
      --bubble-bg-ai: rgba(255,255,255,.04);
      --bubble-bg-user: rgba(124,92,255,.16);

      --chat-scrollbar-thumb: rgba(255,255,255,.16);
      --history-scrollbar-thumb: rgba(255,255,255,.16);
      --grid-opacity: .12;
      --overlay-dim: rgba(4,8,18,.68);
      --overlay-modal: rgba(4,8,18,.80);
      --glass: rgba(15,20,35,.72);
    }

    html[data-theme="light"]{
      --bg-main:#f3f6ff;
      --bg-sidebar:#ffffff;
      --bg-card:#ffffff;
      --bg-input:#ffffff;

      --text-main:#101828;
      --text-sub:#5b657d;

      --border:rgba(16,24,40,.10);
      --shadow: 0 18px 50px rgba(16,24,40,.12);

      --bubble-border: rgba(16,24,40,.10);
      --bubble-bg-ai: rgba(16,24,40,.04);
      --bubble-bg-user: rgba(124,92,255,.12);

      --chat-scrollbar-thumb: rgba(16,24,40,.14);
      --history-scrollbar-thumb: rgba(16,24,40,.14);
      --grid-opacity: .08;
      --overlay-dim: rgba(16,24,40,.42);
      --overlay-modal: rgba(16,24,40,.58);
      --glass: rgba(255,255,255,.82);
    }

    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html, body { height: 100%; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
      background:
        radial-gradient(1000px 500px at 15% 10%, rgba(124,92,255,.22), transparent 60%),
        radial-gradient(900px 500px at 85% 18%, rgba(255,77,141,.18), transparent 55%),
        radial-gradient(700px 500px at 50% 95%, rgba(38,214,166,.12), transparent 55%),
        var(--bg-main);
      color:var(--text-main);
      display:flex;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      transition: background-color .2s ease, color .2s ease;
    }

    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity:var(--grid-opacity);
      pointer-events:none;
      mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
    }

    #sidebar-overlay{
      display:none;
      position:fixed; inset:0;
      background: var(--overlay-dim);
      z-index:90;
      backdrop-filter: blur(8px);
    }

    #auth-modal, #settings-modal, #image-modal{
      position:fixed; inset:0;
      background: var(--overlay-modal);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:1000;
      padding:16px;
      backdrop-filter: blur(10px);
    }

    .auth-card, .settings-card, .image-tool-card{
      background: linear-gradient(180deg, rgba(17,24,42,.96), rgba(10,15,27,.96));
      padding:22px 18px;
      border-radius: 24px;
      border:1px solid rgba(255,255,255,.12);
      width:100%;
      max-width:480px;
      display:flex;
      flex-direction:column;
      gap:12px;
      text-align:center;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    html[data-theme="light"] .auth-card,
    html[data-theme="light"] .settings-card,
    html[data-theme="light"] .image-tool-card{
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(244,247,255,.96));
    }

    .auth-card::after, .settings-card::after, .image-tool-card::after{
      content:"";
      position:absolute;
      width:260px; height:260px;
      right:-120px; top:-140px;
      background: radial-gradient(circle, rgba(124,92,255,.34), transparent 62%);
      pointer-events:none;
    }

    .auth-card h2, .image-tool-card h2{
      font-size:1.35rem;
      letter-spacing:.2px;
      position:relative;
    }

    .auth-card input, .settings-card input, .image-tool-card input, .image-tool-card select, .image-tool-card textarea{
      padding:13px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.05);
      color:var(--text-main);
      outline:none;
      font-size:1rem;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease;
      text-align:left;
      font-family:inherit;
    }
    html[data-theme="light"] .auth-card input,
    html[data-theme="light"] .settings-card input,
    html[data-theme="light"] .image-tool-card input,
    html[data-theme="light"] .image-tool-card select,
    html[data-theme="light"] .image-tool-card textarea{
      background: rgba(16,24,40,.04);
    }

    .auth-card button, .settings-card button, .image-tool-card button{
      padding:12px 14px;
      border-radius:14px;
      border:none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color:white;
      font-weight:850;
      font-size:1rem;
      cursor:pointer;
      transition: transform .1s ease, filter .2s ease, box-shadow .2s ease;
      box-shadow: 0 12px 25px rgba(124,92,255,.22);
    }

    .settings-row{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }
    html[data-theme="light"] .settings-row{
      background: rgba(16,24,40,.03);
    }
    .settings-row .label{ font-weight:900; letter-spacing:.1px; }

    .segmented{
      display:flex;
      background: rgba(255,255,255,.05);
      border:1px solid var(--border);
      border-radius: 14px;
      overflow:hidden;
    }
    html[data-theme="light"] .segmented{ background: rgba(16,24,40,.03); }
    .segmented button{
      border-radius:0;
      border:none;
      background: transparent;
      color: var(--text-main);
      padding:10px 12px;
      font-weight:900;
      font-size:.92rem;
      transition: background .2s ease, color .2s ease;
      box-shadow:none;
    }
    .segmented button.active{
      background: linear-gradient(135deg, rgba(124,92,255,.20), rgba(255,77,141,.18));
      color: var(--text-main);
    }

    aside{
      width:280px;
      background: linear-gradient(180deg, rgba(10,15,27,.96), rgba(8,12,22,.90));
      display:flex;
      flex-direction:column;
      padding:14px;
      border-right:1px solid rgba(255,255,255,.08);
      flex-shrink:0;
      position:fixed;
      top:0; bottom:0; left:0;
      z-index:100;
      transform:translateX(-100%);
      transition: transform .28s cubic-bezier(.2,.9,.2,1);
      backdrop-filter: blur(14px);
    }
    html[data-theme="light"] aside{
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(244,247,255,.95));
      border-right:1px solid rgba(16,24,40,.08);
    }
    @media (min-width: 768px){
      aside{ position:relative; transform:translateX(0) !important; }
      #sidebar-overlay{ display:none !important; }
      .menu-btn{ display:none !important; }
    }
    aside.open{ transform:translateX(0); }

    .sidebar-top{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
    }
    html[data-theme="light"] .brand{ background: rgba(16,24,40,.03); border-color: rgba(16,24,40,.08); }
    .brand .dot{
      width:12px; height:12px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 4px rgba(124,92,255,.14);
    }
    .brand .name{ font-weight:900; letter-spacing:.2px; }

    .new-chat-btn{
      background: linear-gradient(135deg, rgba(124,92,255,.18), rgba(255,77,141,.14));
      border:1px solid rgba(124,92,255,.26);
      color:var(--text-main);
      padding:11px 12px;
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:.95rem;
      cursor:pointer;
      transition: transform .1s ease, background .2s ease, border-color .2s ease;
      width:100%;
      justify-content:flex-start;
      font-weight:800;
    }
    html[data-theme="light"] .new-chat-btn{
      background: linear-gradient(135deg, rgba(124,92,255,.10), rgba(255,77,141,.08));
      border-color: rgba(124,92,255,.18);
    }

    .history-list{
      flex:1;
      margin-top:12px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding-right:6px;
    }
    .history-list::-webkit-scrollbar{ width: 10px; }
    .history-list::-webkit-scrollbar-thumb{ background: var(--history-scrollbar-thumb); border-radius: 20px; }

    .history-item{
      padding:12px 12px;
      font-size:.92rem;
      color: var(--text-sub);
      border-radius: 14px;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border:1px solid rgba(255,255,255,.04);
      background: rgba(255,255,255,.03);
      transition: background .2s ease, border-color .2s ease, color .2s ease, transform .08s ease;
      user-select:none;
      gap:10px;
    }
    .history-item.active{
      background: linear-gradient(135deg, rgba(124,92,255,.16), rgba(255,77,141,.14));
      border-color: rgba(124,92,255,.32);
      color: var(--text-main);
    }

    .user-profile{
      border-top:1px solid rgba(255,255,255,.08);
      padding-top:12px;
      margin-top:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:.95rem;
      gap:10px;
    }

    .user-left{ display:flex; align-items:center; gap:10px; min-width:0; }
    .user-avatar{
      width:34px; height:34px;
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-weight:900;
      background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(255,77,141,.16));
      border:1px solid rgba(124,92,255,.22);
      flex-shrink:0;
    }

    .logout-btn{
      background: rgba(255,107,107,.10);
      border:1px solid rgba(255,107,107,.22);
      color: var(--danger);
      cursor:pointer;
      padding:8px 10px;
      border-radius: 12px;
      font-weight:800;
    }

    main{
      flex:1;
      display:flex;
      flex-direction:column;
      height:100%;
      width:100%;
      position:relative;
      overflow:hidden;
    }

    header{
      padding:12px 14px;
      font-size:1rem;
      font-weight:900;
      color: var(--text-main);
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      gap:10px;
      background: rgba(10,15,27,.70);
      backdrop-filter: blur(14px);
      position:relative;
      z-index:1;
    }

    header .title-wrap{ display:flex; align-items:center; gap:10px; }
    header .spark{
      width:10px; height:10px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 4px rgba(124,92,255,.14);
    }

    .header-actions{ margin-left:auto; display:flex; gap:8px; align-items:center; }
    .icon-btn{
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color: var(--text-main);
      font-size: 1rem;
      cursor:pointer;
      padding: 8px 12px;
      border-radius: 12px;
      transition: background .2s ease;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .menu-btn{
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color: var(--text-main);
      font-size: 1.25rem;
      cursor:pointer;
      padding: 7px 10px;
      border-radius: 12px;
    }

    #chat-container{
      flex:1;
      overflow-y:auto;
      padding: 18px 0;
      display:flex;
      flex-direction:column;
      gap:10px;
      scroll-behavior:smooth;
      position:relative;
    }
    #chat-container::-webkit-scrollbar{ width: 10px; }
    #chat-container::-webkit-scrollbar-thumb{ background: var(--chat-scrollbar-thumb); border-radius: 20px; }

    .message-row{ width:100%; display:flex; justify-content:center; padding: 0 12px; }
    .message-content{
      width: 100%;
      max-width: 860px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }

    .avatar{
      width:36px; height:36px;
      border-radius: 14px;
      display:flex; align-items:center; justify-content:center;
      font-weight:900;
      font-size:.82rem;
      flex-shrink:0;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
    }
    .user .avatar{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
    .ai .avatar{ background: linear-gradient(135deg, var(--accent-3), var(--accent)); color: white; }

    .text{
      flex:1;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: .98rem;
      padding-top: 1px;
    }

    .bubble{
      border-radius: 18px;
      padding: 11px 14px;
      border:1px solid var(--bubble-border);
      background: var(--bubble-bg-ai);
      backdrop-filter: blur(10px);
    }
    .message-row.user .bubble{
      background: linear-gradient(180deg, rgba(124,92,255,.18), rgba(255,77,141,.10));
      border-color: rgba(124,92,255,.28);
    }

    /* Grid Gallery and Individual Image Containers */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 12px;
      width: 100%;
    }

    .image-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .chat-generated-img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      display: block;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .chat-generated-img:hover {
      transform: scale(1.02);
    }

    .dl-img-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(124,92,255,.25), rgba(38,214,166,.25));
      border: 1px solid rgba(255,255,255,.15);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .dl-img-btn:hover {
      background: linear-gradient(135deg, rgba(124,92,255,.45), rgba(38,214,166,.45));
    }

    .dl-img-btn:active {
      transform: scale(0.97);
    }

    .typing{ display:flex; gap:6px; align-items:center; }
    .typing span{
      width:7px; height:7px;
      border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      animation: bounce 1.1s infinite ease-in-out;
    }
    .typing span:nth-child(2){ animation-delay:.12s; }
    .typing span:nth-child(3){ animation-delay:.24s; }
    @keyframes bounce{
      0%,80%,100%{ transform: translateY(0); opacity:.55; }
      40%{ transform: translateY(-5px); opacity:1; }
    }

    footer{
      padding: 10px 10px 14px 10px;
      display:flex;
      justify-content:center;
      background: rgba(10,15,27,.72);
      border-top:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
    }

    .input-container{
      width: 100%;
      max-width: 860px;
      background: var(--glass);
      border-radius: 22px;
      padding: 10px 10px 10px 14px;
      display:flex;
      align-items:flex-end;
      gap:10px;
      border: 1px solid rgba(255,255,255,.10);
    }

    textarea{
      flex:1;
      background: transparent;
      border:none;
      outline:none;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      resize:none;
      max-height: 130px;
      height: 26px;
      padding: 3px 0;
    }

    .send-btn{
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border:none;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-weight:900;
    }

    .error-message{
      color: #ffd1d1;
      padding: 10px 12px;
      background: rgba(255,107,107,.12);
      border-radius: 12px;
      border:1px solid rgba(255,107,107,.22);
      margin: 8px 12px 0 12px;
      align-self:center;
      width: 100%;
      max-width: 860px;
    }

    @media (max-width: 768px){
      aside{ width: 88vw; max-width: 320px; }
      .message-row{ padding: 0 10px; }
      .image-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Auth Modal -->
  <div id="auth-modal" aria-modal="true" role="dialog">
    <div class="auth-card">
      <h2 id="authTitle">Sign in</h2>
      <div class="settings-row" style="border-radius:12px; padding:8px 10px;">
        <span style="color:var(--text-sub); font-weight:800;">Mode</span>
        <div class="segmented" role="tablist" aria-label="Auth selector" style="margin-left:auto;">
          <button type="button" id="mode-login" class="active" onclick="setAuthMode('login')">Login</button>
          <button type="button" id="mode-signup" onclick="setAuthMode('signup')">Sign up</button>
        </div>
      </div>
      <input type="email" id="email" placeholder="Email" autocomplete="email" />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <input type="text" id="username" placeholder="Username (for new accounts)" style="display:none;" />
      <button id="authActionBtn" type="button" onclick="handleAuth()">Continue</button>
      <div id="authHint" class="sub" style="color:var(--text-sub); font-size:.9rem; text-align:center;">Your Friend will use Supabase auth.</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" aria-modal="true" role="dialog">
    <div class="settings-card">
      <h2 style="font-size:1.2rem; letter-spacing:.2px; position:relative;">Settings</h2>
      <div class="settings-row" style="text-align:left;">
        <div>
          <div class="label">Theme</div>
          <div class="sub">Choose Light or Dark</div>
        </div>
        <div class="segmented" role="tablist" aria-label="Theme selector">
          <button type="button" id="theme-light" class="active" onclick="setTheme('light')">Light</button>
          <button type="button" id="theme-dark" onclick="setTheme('dark')">Dark</button>
        </div>
      </div>
      <button type="button" onclick="closeSettings()" style="width:100%;">Done</button>
    </div>
  </div>

  <!-- Advanced Image Generator Tool Modal -->
  <div id="image-modal" aria-modal="true" role="dialog">
    <div class="image-tool-card">
      <h2>🎨 Advanced Image Generator</h2>
      <textarea id="imgPromptInput" placeholder="Describe what you want to generate..." rows="3"></textarea>
      
      <div class="settings-row">
        <span class="label">Count (Batch):</span>
        <select id="imgCountSelect" style="background:transparent; border:none; color:var(--text-main); font-weight:bold;">
          <option value="1">1 Image</option>
          <option value="2">2 Images</option>
          <option value="4" selected>4 Images (Grid)</option>
        </select>
      </div>

      <div class="settings-row">
        <span class="label">Aspect Ratio:</span>
        <select id="imgRatioSelect" style="background:transparent; border:none; color:var(--text-main); font-weight:bold;">
          <option value="1024x1024">Square (1:1)</option>
          <option value="1280x720">Landscape (16:9)</option>
          <option value="720x1280">Portrait (9:16)</option>
        </select>
      </div>

      <div class="settings-row">
        <span class="label">Style Preset:</span>
        <select id="imgStyleSelect" style="background:transparent; border:none; color:var(--text-main); font-weight:bold;">
          <option value="photorealistic" selected>📸 Ultra Realistic Photography</option>
          <option value="cinematic">🎬 Cinematic Movie Shot</option>
          <option value="digital-art">🎨 Digital Art</option>
          <option value="anime">⛩️ Anime / Manga</option>
          <option value="3d-render">💎 3D Render</option>
        </select>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="button" onclick="closeImageModal()" style="background:rgba(255,255,255,0.1); flex:1;">Cancel</button>
        <button type="button" onclick="generateImageFromModal()" style="flex:2;">Generate Batch ✨</button>
      </div>
    </div>
  </div>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <div class="brand" aria-hidden="true">
        <span class="dot"></span>
        <span class="name">Your Friend</span>
      </div>
    </div>
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>

    function isAuthMissingError(err) { const msg = getErrorMessage(err); const name = (err && err.name) ? String(err.name) : ''; return (msg.toLowerCase().includes('auth session missing') || msg.toLowerCase().includes('session') && msg.toLowerCase().includes('missing') || name.toLowerCase().includes('authsessionmissingerror')); }
    function isRlsOrAuthDenied(err) { const status = err && err.status; const msg = getErrorMessage(err); const code = err && err.code ? String(err.code) : ''; return (status === 401 || status === 403 || msg.includes('JWT') || msg.toLowerCase().includes('rls') || msg.toLowerCase().includes('permission denied') || msg.toLowerCase().includes('not authorized') || code === '42501'); }
    async function getValidSession() { try { const { data: { session } } = await supabaseClient.auth.getSession(); return session; } catch (e) { if (isAuthMissingError(e) || isRlsOrAuthDenied(e)) return null; throw e; } }

    async function signUp(email, password, username) { try { const { data, error } = await supabaseClient.auth.signUp({ email, password }); if (error) { alert(getErrorMessage(error)); return; } const userId = data?.user?.id; if (!userId) { alert("Sign up succeeded, but user id was not returned."); return; } const { error: insertErr } = await supabaseClient.from("profiles").upsert({ id: userId, username: username }, { onConflict: 'id' }); if (insertErr) console.warn('Profile upsert error:', getErrorMessage(insertErr)); alert("Account created successfully!"); const { data: { session } } = await supabaseClient.auth.getSession(); if (session?.user) { await hydrateUserAndLoadChats(session.user); setAuthModalVisible(false); } else { setAuthMode('login'); setAuthModalVisible(true); } } catch (err) { console.error('Sign up error:', err); alert('Sign up failed. Please try again.'); } }
    async function login(email, password) { try { const { error } = await supabaseClient.auth.signInWithPassword({ email, password }); if (error) { alert(getErrorMessage(error)); return; } const { data: { session } } = await supabaseClient.auth.getSession(); if (!session?.user) { setAuthMode('login'); setAuthModalVisible(true); return; } await hydrateUserAndLoadChats(session.user); setAuthModalVisible(false); } catch (err) { console.error('Login error:', err); alert('Login failed. Please try again.'); } }
    async function handleAuth() { const email = (emailInput.value || '').trim(); const password = (passwordInput.value || '').trim(); const username = (usernameInput.value || '').trim(); if (!email) return alert("Please enter your email."); if (!password) return alert("Please enter your password."); if (authMode === 'signup') { if (!username) return alert("Please enter your username."); await signUp(email, password, username); } else { await login(email, password); } }
    async function logout() { try { await supabaseClient.auth.signOut(); } catch (e) { console.warn('Sign out error:', e); } finally { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); } }

    function randomSessionId() { if (crypto?.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; const v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); }
    function formatMaybeDateMs(dateVal){ if (!dateVal) return 0; try{ const t = new Date(dateVal).getTime(); return Number.isFinite(t) ? t : 0; }catch{ return 0; } }
    function getChatTitleFromMessages(messages){ const firstUser = (messages || []).find(m => m.role === 'user' && (m.content || '').trim()); if (!firstUser) return 'New Chat'; const t = (firstUser.content || '').trim(); return t.length > 22 ? t.substring(0, 22) + '...' : t; }
    function appendErrorUI(text) { const existing = chatContainer.querySelector('.error-message'); if (existing) existing.remove(); const div = document.createElement('div'); div.className = 'error-message'; div.innerText = text; chatContainer.appendChild(div); chatContainer.scrollTop = chatContainer.scrollHeight; }

    async function ensureProfileForUser(user) { const userId = user?.id; if (!userId) return; const unameFallback = user.email?.split('@')[0] || 'User'; try { const { data: profile, error } = await supabaseClient.from('profiles').select('username').eq('id', userId).maybeSingle(); if (error) console.warn('Profile select error:', getErrorMessage(error)); if (!profile) { const toInsert = { id: userId, username: unameFallback }; const { error: upsertErr } = await supabaseClient.from('profiles').upsert(toInsert, { onConflict: 'id' }); if (upsertErr) console.warn('Profile upsert error:', getErrorMessage(upsertErr)); } return profile || { username: unameFallback }; } catch (err) { console.warn('ensureProfileForUser error:', err); return { username: unameFallback }; } }
    async function hydrateUserAndLoadChats(user) { if (!user?.id) return; currentUserId = user.id; currentUser = null; try { const { data: { session } } = await supabaseClient.auth.getSession(); if (!session?.user) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); return; } } catch (e) { if (isAuthMissingError(e) || isRlsOrAuthDenied(e)) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); return; } } const profile = await ensureProfileForUser(user); const uname = profile?.username || user.email?.split('@')[0] || 'User'; currentUser = uname; document.getElementById('userDisplay').innerText = currentUser; setAuthModalVisible(false); await loadAllChatsFromSupabase(); if (!Object.keys(userSessions).length) { createNewChat(true); } else { const sessionIds = Object.keys(userSessions).sort((a, b) => { const ta = Number(userSessions[a]?.lastCreatedAtMs || 0); const tb = Number(userSessions[b]?.lastCreatedAtMs || 0); return tb - ta; }); currentSessionId = sessionIds[0] || null; renderHistorySidebar(); renderActiveChat(); } }
    async function loadAllChatsFromSupabase() { userSessions = {}; currentSessionId = null; try { const { data: rows, error } = await supabaseClient.from('chats').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true }); if (error) throw error; if (!rows) return; for (const row of rows) { const sessionId = row.session_id; if (!sessionId) continue; if (!userSessions[sessionId]) { userSessions[sessionId] = { title: 'Chat', messages: [], createdAtMs: formatMaybeDateMs(row.created_at), lastCreatedAtMs: formatMaybeDateMs(row.created_at) }; } const createdAtMs = formatMaybeDateMs(row.created_at); userSessions[sessionId].lastCreatedAtMs = Math.max(userSessions[sessionId].lastCreatedAtMs || 0, createdAtMs); const exists = userSessions[sessionId].messages.some(m => m.role === row.role && m.content === row.message && Number(m.createdAtMs) === createdAtMs); if (exists) continue; if (row.role === 'system') { userSessions[sessionId].messages.push({ role: 'system', content: row.message, createdAtMs }); } else if (row.role === 'user') { userSessions[sessionId].messages.push({ role: 'user', content: row.message, createdAtMs }); if (userSessions[sessionId].title === 'Chat') { userSessions[sessionId].title = getChatTitleFromMessages(userSessions[sessionId].messages); } } else if (row.role === 'assistant') { userSessions[sessionId].messages.push({ role: 'assistant', content: row.message, createdAtMs }); } else { userSessions[sessionId].messages.push({ role: row.role, content: row.message, createdAtMs }); } } for (const sid of Object.keys(userSessions)) { userSessions[sid].title = getChatTitleFromMessages(userSessions[sid].messages); } } catch (err) { console.error('Load chats error:', err); if (isAuthMissingError(err) || isRlsOrAuthDenied(err)) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); return; } appendErrorUI('❌ Failed to load your chat history. Please try again.'); userSessions = {}; } }

    function createNewChat(silent = false) { currentSessionId = randomSessionId(); userSessions[currentSessionId] = { title: 'New Chat', messages: [{ role: 'system', content: DEFAULT_SYSTEM_PROMPT, createdAtMs: Date.now() }], createdAtMs: Date.now(), lastCreatedAtMs: Date.now() }; if (!silent) { renderHistorySidebar(); renderActiveChat(); if (window.innerWidth < 768) toggleSidebar(); } }

    function renderHistorySidebar() {
      historyList.innerHTML = '';
      const sessionIds = Object.keys(userSessions).sort((a, b) => {
        const ta = Number(userSessions[a]?.createdAtMs || 0);

        left.style.minWidth = '0';
        left.style.overflow = 'hidden';
        left.style.textOverflow = 'ellipsis';
        left.style.whiteSpace = 'nowrap';
        left.style.flex = '1';
        left.innerText = title;

        const right = document.createElement('div');
        right.style.display = 'flex';
        right.style.alignItems = 'center';

        right.style.flexShrink = '0';

        item.onclick = () => switchSession(id);

    async function deleteChat(sessionId) {
      if (!sessionId) return;
      const session = userSessions[sessionId];
      const title = session?.title || 'Chat';
      if (!confirm(`Delete "${title}"? This action cannot be undone.`)) return;

      try {
        const { error } = await supabaseClient.from('chats').delete().eq('user_id', currentUserId).eq('session_id', sessionId);
        if (error) { alert('Failed to delete chat.'); return; }
        delete userSessions[sessionId];
        if (currentSessionId === sessionId) {
          const sessionIds = Object.keys(userSessions);
          if (sessionIds.length > 0) {
            currentSessionId = sessionIds[0];
            await loadSessionMessagesFromSupabase(currentSessionId);
          } else {
            createNewChat(true);
          }
        }
        renderHistorySidebar();
        renderActiveChat();
      } catch (err) { console.error('Delete chat error:', err); }
    }

    async function switchSession(id) { currentSessionId = id; await loadSessionMessagesFromSupabase(id); renderHistorySidebar(); renderActiveChat(); if (window.innerWidth < 768) toggleSidebar(); }
    async function loadSessionMessagesFromSupabase(sessionId) { if (!currentUserId) return; try { const { data: rows, error } = await supabaseClient.from('chats').select('*').eq('user_id', currentUserId).eq('session_id', sessionId).order('created_at', { ascending: true }); if (error) throw error; if (!rows || rows.length === 0) return; const messages = rows.map(r => ({ role: r.role, content: r.message, createdAtMs: formatMaybeDateMs(r.created_at) })); if (!userSessions[sessionId]) userSessions[sessionId] = { title: 'Chat', messages: [], createdAtMs: Date.now() }; userSessions[sessionId].messages = messages; userSessions[sessionId].title = getChatTitleFromMessages(messages); } catch (err) { console.error('Load session error:', err); } }
    
    function renderActiveChat() { 
      chatContainer.innerHTML = ''; 
      const session = userSessions[currentSessionId]; 
      if (!session) return; 
      session.messages.forEach((msg) => { 
        if (msg.role !== 'system') appendMessageUI(msg.role === 'user' ? 'user' : 'ai', msg.content, false); 
      }); 
      chatContainer.scrollTop = chatContainer.scrollHeight; 
    }

    // Direct Image Downloader Helper
    async function downloadIndividualImage(url, index) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `generated-image-${index + 1}-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        // Fallback for CORS restriction
        window.open(url, '_blank');
      }
    }

    function appendMessageUI(role, text, doScroll = true) { 
      const row = document.createElement('div'); 
      row.className = `message-row ${role}`; 
      const content = document.createElement('div'); 
      content.className = 'message-content'; 
      const avatar = document.createElement('div'); 
      avatar.className = 'avatar'; 
      avatar.innerText = role === 'user' ? 'You' : 'YF'; 
      const bubble = document.createElement('div'); 
      bubble.className = 'bubble'; 
      const textDiv = document.createElement('div'); 
      textDiv.className = 'text'; 

      if (text && text.trim() === '__TYPING__') { 
        const typing = document.createElement('div'); 
        typing.className = 'typing'; 
        typing.innerHTML = '<span></span><span></span><span></span>'; 
        textDiv.appendChild(typing); 
      } else if (text && text.startsWith('IMAGE_GRID:')) {
        const rawJson = text.replace('IMAGE_GRID:', '').trim();
        try {
          const payload = JSON.parse(rawJson);
          textDiv.innerHTML = `<div>Generated ${payload.urls.length} Image(s) for "${payload.prompt}":</div>`;
          const grid = document.createElement('div');
          grid.className = 'image-grid';
          payload.urls.forEach((url, idx) => {
            const card = document.createElement('div');
            card.className = 'image-card';

            const img = document.createElement('img');
            img.src = url;
            img.className = 'chat-generated-img';
            img.alt = payload.prompt;
            img.onclick = () => window.open(url, '_blank');

            const dlBtn = document.createElement('button');
            dlBtn.className = 'dl-img-btn';
            dlBtn.innerHTML = '⬇️ Download Image';
            dlBtn.onclick = (e) => {
              e.stopPropagation();
              downloadIndividualImage(url, idx);
            };

            card.appendChild(img);
            card.appendChild(dlBtn);
            grid.appendChild(card);
          });
          textDiv.appendChild(grid);
        } catch(e) {
          textDiv.innerText = text;
        }
      } else { 
        textDiv.innerText = text; 
      } 

      bubble.appendChild(textDiv); 
      content.appendChild(avatar); 
      content.appendChild(bubble); 
      row.appendChild(content); 
      chatContainer.appendChild(row); 
      if (doScroll) chatContainer.scrollTop = chatContainer.scrollHeight; 
      return textDiv; 
    }

    function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; }

    /* ================= ADVANCED MULTI-IMAGE GENERATION ENGINE ================= */
    async function processImageGeneration(rawPrompt, count = 1, dimensions = "1024x1024", styleModifier = "photorealistic") {
      let prompt = rawPrompt.trim();
      const currentSession = userSessions[currentSessionId];

      if (currentSession.title === 'New Chat' || currentSession.title === 'Chat') {
        currentSession.title = "🎨 Image: " + (prompt.length > 15 ? prompt.substring(0, 15) + '...' : prompt);
      }

      appendMessageUI('user', `/image ${prompt}`);
      userInput.value = '';
      userInput.style.height = 'auto';

      // Save user command to DB
      try {
        await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'user', message: `/image ${prompt}`, created_at: new Date().toISOString() });
      } catch (dbErr) { console.warn('DB save warning:', dbErr); }
      currentSession.messages.push({ role: 'user', content: `/image ${prompt}`, createdAtMs: Date.now() });

      const aiTextNode = appendMessageUI('ai', `🎨 Generating ${count} high-resolution image(s)...`);

      // Photorealism keyword injection to fix painting aesthetic
      let enhancedPrompt = prompt;
      if (styleModifier === 'photorealistic') {
        enhancedPrompt += ", highly detailed photograph, 8k resolution, raw photo, ultra-realistic DSLR shot, natural sharp lighting, fine texture, unedited portrait";
      } else if (styleModifier === 'cinematic') {
        enhancedPrompt += ", cinematic film shot, IMAX 35mm lens, atmospheric depth, photo, realistic shot";
      } else if (styleModifier) {
        enhancedPrompt += `, in ${styleModifier} style`;
      }

      const [width, height] = dimensions.split('x');
      const imageUrls = [];

      for (let i = 0; i < count; i++) {
        const seed = Math.floor(Math.random() * 9000000) + 1000000;
        const encodedPrompt = encodeURIComponent(enhancedPrompt);
        const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&enhance=true`;
        imageUrls.push(url);
      }

      const payloadObj = { prompt: prompt, urls: imageUrls };
      const imagePayload = `IMAGE_GRID:${JSON.stringify(payloadObj)}`;

      // Render image gallery inside UI with individual download buttons
      aiTextNode.innerHTML = `<div>Generated ${count} Realistic Image(s) for "${prompt}":</div>`;
      const grid = document.createElement('div');
      grid.className = 'image-grid';
      imageUrls.forEach((url, idx) => {
        const card = document.createElement('div');
        card.className = 'image-card';

        const img = document.createElement('img');
        img.src = url;
        img.className = 'chat-generated-img';
        img.alt = prompt;
        img.onclick = () => window.open(url, '_blank');

        const dlBtn = document.createElement('button');
        dlBtn.className = 'dl-img-btn';
        dlBtn.innerHTML = '⬇️ Download Image';
        dlBtn.onclick = (e) => {
          e.stopPropagation();
          downloadIndividualImage(url, idx);
        };

        card.appendChild(img);
        card.appendChild(dlBtn);
        grid.appendChild(card);
      });
      aiTextNode.appendChild(grid);

      // Save Assistant payload to DB
      try {
        await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'assistant', message: imagePayload, created_at: new Date().toISOString() });
      } catch (dbErr) { console.warn('DB save warning:', dbErr); }
      currentSession.messages.push({ role: 'assistant', content: imagePayload, createdAtMs: Date.now() });
      
      renderHistorySidebar();
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function generateImageFromModal() {
      const prompt = document.getElementById('imgPromptInput').value.trim();
      const count = parseInt(document.getElementById('imgCountSelect').value, 10) || 1;
      const ratio = document.getElementById('imgRatioSelect').value;
      const style = document.getElementById('imgStyleSelect').value;

      if (!prompt) return alert('Please enter an image prompt.');

      closeImageModal();
      document.getElementById('imgPromptInput').value = '';
      
      await processImageGeneration(prompt, count, ratio, style);
    }

    /* ================= MAIN SEND MESSAGE LOGIC ================= */
    async function sendMessage() { 
      const text = userInput.value.trim(); 
      if (!text || !currentSessionId) return; 
      if (sendInFlight) return; 

      // Check for inline image generation trigger command
      if (text.startsWith('/image')) {
        const prompt = text.replace('/image', '').trim();
        if (!prompt) return alert('Please provide a prompt after /image (e.g. /image realistic lion in savanna)');
        await processImageGeneration(prompt, 2, "1024x1024", "photorealistic");
        return;
      }

      sendInFlight = true; 
      sendBtn.disabled = true; 
      let aiTextNode = null; 

      try { 
        const session = await getValidSession(); 
        if (!session?.user) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); sendBtn.disabled = false; sendInFlight = false; return; } 
        currentUserId = session.user.id; 
        const currentSession = userSessions[currentSessionId]; 
        if (!currentSession) { createNewChat(true); return; } 

        if (currentSession.title === 'New Chat' || currentSession.title === 'Chat') { 
          currentSession.title = text.length > 22 ? text.substring(0, 22) + '...' : text; 
        } 
        
        appendMessageUI('user', text); 
        userInput.value = ''; 
        userInput.style.height = 'auto'; 

        try { 
          await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'user', message: text, created_at: new Date().toISOString() }); 
        } catch (dbErr) { console.warn('DB save warning:', dbErr); } 

        currentSession.messages.push({ role: 'user', content: text, createdAtMs: Date.now() }); 
        aiTextNode = appendMessageUI('ai', '__TYPING__'); 

        let aiMessages = currentSession.messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content })); 
        aiMessages = aiMessages.map(msg => { 
          if (msg.content && msg.content.length > 1000) { 
            return { ...msg, content: msg.content.substring(0, 1000) + '... [truncated]' }; 
          } 
          return msg; 
        }); 

        if (aiMessages.length > 10) { aiMessages = aiMessages.slice(-10); } 

        const response = await fetch(PROXY_URL, { 
          method: "POST", 
          headers: { "Content-Type": "application/json" }, 
          body: JSON.stringify({ messages: aiMessages, model: "llama-3.3-70b-versatile", temperature: 0.7, max_tokens: 1024 }) 
        }); 

        if (!response.ok) { 
          const errorText = await response.text(); 
          let errorMsg; 
          try { 
            const errorJson = JSON.parse(errorText); 
            errorMsg = errorJson?.error?.message || errorJson?.error || errorJson?.message || `HTTP ${response.status}`; 
          } catch { errorMsg = errorText || `HTTP ${response.status}`; } 
          throw new Error(errorMsg); 
        } 

        const data = await response.json(); 
        const reply = data?.choices?.[0]?.message?.content; 
        if (!reply) throw new Error('AI response missing content'); 

        try { 
          await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'assistant', message: reply, created_at: new Date().toISOString() }); 
        } catch (dbErr) { console.warn('DB save warning:', dbErr); } 

        currentSession.messages.push({ role: 'assistant', content: reply, createdAtMs: Date.now() }); 
        currentSession.lastCreatedAtMs = Date.now(); 
        if (aiTextNode) aiTextNode.innerText = reply; 

        renderHistorySidebar(); 
        chatContainer.scrollTop = chatContainer.scrollHeight; 
      } catch (err) { 
        let errorMsg = err?.message || String(err); 
        if (aiTextNode) { 
          aiTextNode.innerText = '❌ ' + errorMsg; 
          aiTextNode.style.color = 'var(--danger)'; 
        } else { 
          appendErrorUI('❌ ' + errorMsg); 
        } 
      } finally { 
        sendInFlight = false; 
        sendBtn.disabled = false; 
      } 
    }

    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    window.createNewChat = createNewChat;
    window.toggleSidebar = toggleSidebar;
    window.openSettings = openSettings;
    window.closeSettings = closeSettings;
    window.openImageModal = openImageModal;
    window.closeImageModal = closeImageModal;
    window.generateImageFromModal = generateImageFromModal;
    window.setAuthMode = setAuthMode;
    window.setTheme = setTheme;
    window.logout = logout;
    window.handleAuth = handleAuth;
    window.sendMessage = sendMessage;
    window.deleteChat = deleteChat;
    window.downloadIndividualImage = downloadIndividualImage;
  </script>
</body>
</html>
