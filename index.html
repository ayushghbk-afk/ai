<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>update Clone with Login & History</title>
  <style>
    :root {
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-card-user: #2f2f2f;
      --bg-input: #2f2f2f;
      --text-main: #ececec;
      --text-sub: #b4b4b4;
      --border-color: #424242;
      --accent-green: #10a37f;
      --accent-hover: #1a7f64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Auth Modal */
    #auth-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-card {
      background: var(--bg-sidebar);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }

    .auth-card h2 {
      font-size: 1.4rem;
    }

    .auth-card input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .auth-card button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: var(--accent-green);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-card button:hover {
      background: var(--accent-hover);
    }

    /* Sidebar */
    aside {
      width: 260px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: #212121;
    }

    .history-list {
      flex: 1;
      margin-top: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--text-sub);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover, .history-item.active {
      background: var(--bg-card-user);
      color: var(--text-main);
    }

    .user-profile {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #ff5555;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Main Chat Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-sub);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }

    .message-row {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 16px 20px;
    }

    .message-content {
      max-width: 768px;
      width: 100%;
      display: flex;
      gap: 16px;
      line-height: 1.6;
      font-size: 1rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .user .avatar { background-color: #5436da; color: white; }
    .ai .avatar { background-color: var(--accent-green); color: white; }

    .text {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      padding-top: 2px;
    }

    .message-row.user .text {
      background-color: var(--bg-card-user);
      padding: 10px 16px;
      border-radius: 18px;
      display: inline-block;
      max-width: fit-content;
    }

    /* Input Footer */
    footer {
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-container {
      max-width: 768px;
      width: 100%;
      background-color: var(--bg-input);
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      max-height: 200px;
      height: 24px;
      padding: 2px 0;
    }

    .send-btn {
      background-color: var(--text-main);
      color: var(--bg-main);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="auth-modal">
    <div class="auth-card">
      <h2 id="modal-title">Login</h2>
      <input type="text" id="username" placeholder="Enter Username" />
      <input type="password" id="password" placeholder="Enter Password" />
      <button onclick="handleAuth()">Submit</button>
    </div>
  </div>

  <!-- Left Sidebar -->
  <aside>
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>
    <div class="history-list" id="historyList"></div>
    <div class="user-profile">
      <span id="userDisplay">User</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main>
    <header>build by your friend</header>

    <div id="chat-container"></div>

    <footer>
      <div class="input-container">
        <textarea id="userInput" placeholder="Message ChatGPT..." rows="1" oninput="autoResize(this)"></textarea>
        <button id="sendBtn" class="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </footer>
  </main>

  <script>
    const API_KEY = "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"; // Substitute your key here

    let currentUser = null;
    let currentSessionId = null;
    let userSessions = {}; 

    // DOM Elements
    const authModal = document.getElementById('auth-modal');
    const usernameInput = document.getElementById('username');
    const historyList = document.getElementById('historyList');
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Load Session state on initial setup
    window.onload = () => {
      const savedUser = localStorage.getItem('logged_user');
      if (savedUser) {
        loginUser(savedUser);
      }
    };

    function handleAuth() {
      const name = usernameInput.value.trim();
      if (!name) return alert("Please enter a username.");
      loginUser(name);
    }

    function loginUser(name) {
      currentUser = name;
      localStorage.setItem('logged_user', currentUser);
      document.getElementById('userDisplay').innerText = currentUser;
      authModal.style.display = 'none';

      // Load User's Chat Sessions from localStorage
      const storedData = localStorage.getItem(`sessions_${currentUser}`);
      userSessions = storedData ? JSON.parse(storedData) : {};

      renderHistorySidebar();
      createNewChat();
    }

    function logout() {
      localStorage.removeItem('logged_user');
      location.reload();
    }

    function saveSessionsToStorage() {
      localStorage.setItem(`sessions_${currentUser}`, JSON.stringify(userSessions));
    }

    function createNewChat() {
      currentSessionId = 'session_' + Date.now();
      userSessions[currentSessionId] = {
        title: 'New Chat',
        messages: [{ role: 'system', content: 'You are a helpful assistant.' }]
      };
      
      saveSessionsToStorage();
      renderHistorySidebar();
      renderActiveChat();
    }

    function renderHistorySidebar() {
      historyList.innerHTML = '';
      Object.keys(userSessions).reverse().forEach(id => {
        const item = document.createElement('div');
        item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
        item.innerText = userSessions[id].title;
        item.onclick = () => switchSession(id);
        historyList.appendChild(item);
      });
    }

    function switchSession(id) {
      currentSessionId = id;
      renderHistorySidebar();
      renderActiveChat();
    }

    function renderActiveChat() {
      chatContainer.innerHTML = '';
      const session = userSessions[currentSessionId];
      
      if (!session) return;

      session.messages.forEach(msg => {
        if (msg.role !== 'system') {
          appendMessageUI(msg.role === 'user' ? 'user' : 'ai', msg.content);
        }
      });
    }

    function appendMessageUI(role, text) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const content = document.createElement('div');
      content.className = 'message-content';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = role === 'user' ? 'U' : 'G';

      const textDiv = document.createElement('div');
      textDiv.className = 'text';
      textDiv.innerText = text;

      content.appendChild(avatar);
      content.appendChild(textDiv);
      row.appendChild(content);

      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return textDiv;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || !currentSessionId) return;

      // Update Session Title if it's the first message
      const currentSession = userSessions[currentSessionId];
      if (currentSession.messages.length === 1) {
        currentSession.title = text.substring(0, 24) + '...';
        renderHistorySidebar();
      }

      // Render User Message UI
      appendMessageUI('user', text);
      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;

      // Store in Session
      currentSession.messages.push({ role: 'user', content: text });
      saveSessionsToStorage();

      const aiTextNode = appendMessageUI('ai', 'Thinking...');

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: currentSession.messages
          })
        });

        const data = await response.json();

        if (response.ok) {
          const reply = data.choices[0].message.content;
          aiTextNode.innerText = reply;

          // Store AI response in Session Context
          currentSession.messages.push({ role: 'assistant', content: reply });
          saveSessionsToStorage();
        } else {
          aiTextNode.innerText = "Error: " + (data.error?.message || "Failed to respond.");
        }
      } catch (err) {
        aiTextNode.innerText = "Network error while calling API.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
