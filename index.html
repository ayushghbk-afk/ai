<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Your Friend - AI Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg-main:#0b1020;
      --bg-sidebar:#0a0f1b;
      --bg-card:#11182a;
      --bg-input:#11182a;
      --text-main:#f4f7ff;
      --text-sub:#a9b4d0;
      --border:rgba(255,255,255,.10);

      --accent:#7c5cff;
      --accent-2:#ff4d8d;
      --accent-3:#26d6a6;

      --warning:#ffcc66;
      --danger:#ff6b6b;

      --shadow: 0 18px 50px rgba(0,0,0,.40);

      --bubble-border: rgba(255,255,255,.10);
      --bubble-bg-ai: rgba(255,255,255,.04);
      --bubble-bg-user: rgba(124,92,255,.16);

      --chat-scrollbar-thumb: rgba(255,255,255,.16);
      --history-scrollbar-thumb: rgba(255,255,255,.16);

      --grid-opacity: .12;
      --overlay-dim: rgba(4,8,18,.68);
      --overlay-modal: rgba(4,8,18,.80);

      --glass: rgba(15,20,35,.72);

      /* new colorful accents */
      --glow-purple: 0 0 0 1px rgba(124,92,255,.20), 0 18px 60px rgba(124,92,255,.16);
      --glow-pink: 0 0 0 1px rgba(255,77,141,.18), 0 18px 60px rgba(255,77,141,.12);
      --glow-green: 0 0 0 1px rgba(38,214,166,.18), 0 18px 60px rgba(38,214,166,.12);

      --chip-bg: rgba(255,255,255,.06);
      --chip-border: rgba(255,255,255,.10);
    }

    html[data-theme="light"]{
      --bg-main:#f3f6ff;
      --bg-sidebar:#ffffff;
      --bg-card:#ffffff;
      --bg-input:#ffffff;

      --text-main:#101828;
      --text-sub:#5b657d;

      --border:rgba(16,24,40,.10);
      --shadow: 0 18px 50px rgba(16,24,40,.12);

      --bubble-border: rgba(16,24,40,.10);
      --bubble-bg-ai: rgba(16,24,40,.04);
      --bubble-bg-user: rgba(124,92,255,.12);

      --chat-scrollbar-thumb: rgba(16,24,40,.14);
      --history-scrollbar-thumb: rgba(16,24,40,.14);

      --grid-opacity: .08;
      --overlay-dim: rgba(16,24,40,.42);
      --overlay-modal: rgba(16,24,40,.58);
      --glass: rgba(255,255,255,.82);

      --chip-bg: rgba(16,24,40,.04);
      --chip-border: rgba(16,24,40,.08);
    }

    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html, body { height: 100%; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(124,92,255,.30), transparent 58%),
        radial-gradient(1000px 600px at 85% 18%, rgba(255,77,141,.22), transparent 52%),
        radial-gradient(800px 550px at 50% 95%, rgba(38,214,166,.16), transparent 55%),
        radial-gradient(500px 260px at 55% 40%, rgba(124,92,255,.12), transparent 60%),
        var(--bg-main);
      color:var(--text-main);
      display:flex;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      transition: background-color .2s ease, color .2s ease;
    }

    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity:var(--grid-opacity);
      pointer-events:none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    #sidebar-overlay{
      display:none;
      position:fixed; inset:0;
      background: var(--overlay-dim);
      z-index:90;
      backdrop-filter: blur(8px);
    }

    #auth-modal, #settings-modal, #image-modal{
      position:fixed; inset:0;
      background: var(--overlay-modal);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:1000;
      padding:16px;
      backdrop-filter: blur(10px);
    }

    .auth-card, .settings-card, .image-tool-card{
      background: linear-gradient(180deg, rgba(17,24,42,.90), rgba(10,15,27,.90));
      padding:22px 18px;
      border-radius: 24px;
      border:1px solid rgba(255,255,255,.14);
      width:100%;
      max-width:480px;
      display:flex;
      flex-direction:column;
      gap:12px;
      text-align:center;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .auth-card::before, .settings-card::before, .image-tool-card::before{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(500px 240px at 15% 0%, rgba(124,92,255,.26), transparent 60%),
                  radial-gradient(420px 220px at 90% 15%, rgba(255,77,141,.18), transparent 55%);
      pointer-events:none;
      opacity:.9;
    }

    html[data-theme="light"] .auth-card,
    html[data-theme="light"] .settings-card,
    html[data-theme="light"] .image-tool-card{
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(244,247,255,.92));
    }

    .auth-card::after, .settings-card::after, .image-tool-card::after{
      content:"";
      position:absolute;
      width:260px; height:260px;
      right:-120px; top:-140px;
      background: radial-gradient(circle, rgba(124,92,255,.34), transparent 62%);
      pointer-events:none;
    }

    .auth-card h2, .image-tool-card h2{
      font-size:1.35rem;
      letter-spacing:.2px;
      position:relative;
    }

    .auth-card input, .settings-card input, .image-tool-card input, .image-tool-card select, .image-tool-card textarea{
      padding:13px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.05);
      color:var(--text-main);
      outline:none;
      font-size:1rem;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease, background .15s ease;
      text-align:left;
      font-family:inherit;
      position:relative;
      z-index:1;
    }

    .auth-card input:focus, .settings-card input:focus, .image-tool-card input:focus,
    .image-tool-card select:focus, .image-tool-card textarea:focus{
      border-color: rgba(124,92,255,.45);
      box-shadow: 0 0 0 4px rgba(124,92,255,.14);
    }

    html[data-theme="light"] .auth-card input,
    html[data-theme="light"] .settings-card input,
    html[data-theme="light"] .image-tool-card input,
    html[data-theme="light"] .image-tool-card select,
    html[data-theme="light"] .image-tool-card textarea{
      background: rgba(16,24,40,.04);
    }

    .auth-card button, .settings-card button, .image-tool-card button{
      padding:12px 14px;
      border-radius:14px;
      border:none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color:white;
      font-weight:850;
      font-size:1rem;
      cursor:pointer;
      transition: transform .1s ease, filter .2s ease, box-shadow .2s ease, opacity .2s ease;
      box-shadow: 0 12px 25px rgba(124,92,255,.22);
      position:relative;
      z-index:1;
    }

    .auth-card button:hover, .settings-card button:hover, .image-tool-card button:hover{
      filter: saturate(1.1) brightness(1.05);
      box-shadow: var(--glow-purple);
    }

    .auth-card button:active, .settings-card button:active, .image-tool-card button:active{
      transform: translateY(1px) scale(.99);
    }

    .settings-row{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }

    html[data-theme="light"] .settings-row{
      background: rgba(16,24,40,.03);
    }

    .settings-row .label{ font-weight:900; letter-spacing:.1px; }

    .segmented{
      display:flex;
      background: rgba(255,255,255,.05);
      border:1px solid var(--border);
      border-radius: 14px;
      overflow:hidden;
      position:relative;
      z-index:1;
    }

    html[data-theme="light"] .segmented{ background: rgba(16,24,40,.03); }
    .segmented button{
      border-radius:0;
      border:none;
      background: transparent;
      color: var(--text-main);
      padding:10px 12px;
      font-weight:900;
      font-size:.92rem;
      transition: background .2s ease, color .2s ease, transform .1s ease;
      box-shadow:none;
    }

    .segmented button.active{
      background: linear-gradient(135deg, rgba(124,92,255,.26), rgba(255,77,141,.18));
      color: var(--text-main);
    }

    aside{
      width:280px;
      background: linear-gradient(180deg, rgba(10,15,27,.96), rgba(8,12,22,.90));
      display:flex;
      flex-direction:column;
      padding:14px;
      border-right:1px solid rgba(255,255,255,.08);
      flex-shrink:0;
      position:fixed;
      top:0; bottom:0; left:0;
      z-index:100;
      transform:translateX(-100%);
      transition: transform .28s cubic-bezier(.2,.9,.2,1), border-color .2s ease;
      backdrop-filter: blur(14px);
    }

    html[data-theme="light"] aside{
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(244,247,255,.95));
      border-right:1px solid rgba(16,24,40,.08);
    }

    @media (min-width: 768px){
      aside{ position:relative; transform:translateX(0) !important; }
      #sidebar-overlay{ display:none !important; }
      .menu-btn{ display:none !important; }
    }

    aside.open{ transform:translateX(0); }

    .sidebar-top{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .brand{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }

    html[data-theme="light"] .brand{ background: rgba(16,24,40,.03); border-color: rgba(16,24,40,.08); }

    .brand .dot{
      width:12px; height:12px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 4px rgba(124,92,255,.14), 0 0 35px rgba(124,92,255,.20);
    }

    .brand .name{ font-weight:900; letter-spacing:.2px; }

    .new-chat-btn{
      background: linear-gradient(135deg, rgba(124,92,255,.18), rgba(255,77,141,.14));
      border:1px solid rgba(124,92,255,.26);
      color:var(--text-main);
      padding:11px 12px;
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:.95rem;
      cursor:pointer;
      transition: transform .1s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
      width:100%;
      justify-content:flex-start;
      font-weight:800;
      box-shadow: 0 10px 26px rgba(124,92,255,.12);
      position:relative;
      z-index:1;
    }

    .new-chat-btn:hover{ box-shadow: var(--glow-pink); transform: translateY(-1px); }
    .new-chat-btn:active{ transform: translateY(0px) scale(.99); }

    .history-list{
      flex:1;
      margin-top:12px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding-right:6px;
    }

    .history-list::-webkit-scrollbar{ width: 10px; }
    .history-list::-webkit-scrollbar-thumb{ background: var(--history-scrollbar-thumb); border-radius: 20px; }

    .history-item{
      padding:12px 12px;
      font-size:.92rem;
      color: var(--text-sub);
      border-radius: 14px;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border:1px solid rgba(255,255,255,.04);
      background: rgba(255,255,255,.02);
      transition: background .2s ease, border-color .2s ease, color .2s ease, transform .08s ease, box-shadow .2s ease;
      user-select:none;
      gap:10px;
    }

    .history-item:hover{
      background: rgba(255,255,255,.04);
      border-color: rgba(124,92,255,.24);
      box-shadow: 0 12px 34px rgba(124,92,255,.10);
      transform: translateY(-1px);
    }

    .history-item.active{
      background: linear-gradient(135deg, rgba(124,92,255,.18), rgba(255,77,141,.12));
      border-color: rgba(124,92,255,.35);
      color: var(--text-main);
      box-shadow: var(--glow-purple);
    }

    .user-profile{
      border-top:1px solid rgba(255,255,255,.08);
      padding-top:12px;
      margin-top:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:.95rem;
      gap:10px;
    }

    .user-left{ display:flex; align-items:center; gap:10px; min-width:0; }
    .user-avatar{
      width:34px; height:34px;
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-weight:900;
      background: linear-gradient(135deg, rgba(124,92,255,.28), rgba(255,77,141,.18));
      border:1px solid rgba(124,92,255,.22);
      flex-shrink:0;
      box-shadow: 0 14px 30px rgba(124,92,255,.15);
    }

    .logout-btn{
      background: rgba(255,107,107,.10);
      border:1px solid rgba(255,107,107,.22);
      color: var(--danger);
      cursor:pointer;
      padding:8px 10px;
      border-radius: 12px;
      font-weight:800;
      transition: transform .1s ease, box-shadow .2s ease, background .2s ease;
    }

    .logout-btn:hover{ background: rgba(255,107,107,.16); box-shadow: 0 18px 50px rgba(255,107,107,.12); transform: translateY(-1px); }
    .logout-btn:active{ transform: translateY(0px) scale(.99); }

    main{
      flex:1;
      display:flex;
      flex-direction:column;
      height:100%;
      width:100%;
      position:relative;
      overflow:hidden;
    }

    header{
      padding:12px 14px;
      font-size:1rem;
      font-weight:900;
      color: var(--text-main);
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      gap:10px;
      background: linear-gradient(180deg, rgba(10,15,27,.75), rgba(10,15,27,.50));
      backdrop-filter: blur(14px);
      position:relative;
      z-index:1;
    }

    html[data-theme="light"] header{
      background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(244,247,255,.72));
      border-bottom:1px solid rgba(16,24,40,.08);
    }

    header .title-wrap{ display:flex; align-items:center; gap:10px; }
    header .spark{
      width:10px; height:10px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 4px rgba(124,92,255,.14), 0 0 35px rgba(124,92,255,.22);
    }

    .header-actions{ margin-left:auto; display:flex; gap:8px; align-items:center; }
    .icon-btn{
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color: var(--text-main);
      font-size: 1rem;
      cursor:pointer;
      padding: 8px 12px;
      border-radius: 12px;
      transition: background .2s ease, transform .1s ease, box-shadow .2s ease, border-color .2s ease;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:6px;
      position:relative;
      z-index:1;
    }
    .icon-btn:hover{
      background: rgba(255,255,255,.07);
      border-color: rgba(124,92,255,.25);
      box-shadow: 0 14px 40px rgba(124,92,255,.14);
      transform: translateY(-1px);
    }
    .icon-btn:active{ transform: translateY(0px) scale(.99); }

    .menu-btn{
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color: var(--text-main);
      font-size: 1.25rem;
      cursor:pointer;
      padding: 7px 10px;
      border-radius: 12px;
      transition: background .2s ease, transform .1s ease, border-color .2s ease;
    }
    .menu-btn:hover{ background: rgba(255,255,255,.07); border-color: rgba(124,92,255,.25); transform: translateY(-1px); }
    .menu-btn:active{ transform: translateY(0px) scale(.99); }

    #chat-container{
      flex:1;
      overflow-y:auto;
      padding: 18px 0;
      display:flex;
      flex-direction:column;
      gap:10px;
      scroll-behavior:smooth;
      position:relative;
    }
    #chat-container::-webkit-scrollbar{ width: 10px; }
    #chat-container::-webkit-scrollbar-thumb{ background: var(--chat-scrollbar-thumb); border-radius: 20px; }

    .message-row{ width:100%; display:flex; justify-content:center; padding: 0 12px; }
    .message-content{
      width: 100%;
      max-width: 860px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }

    .avatar{
      width:36px; height:36px;
      border-radius: 14px;
      display:flex; align-items:center; justify-content:center;
      font-weight:900;
      font-size:.82rem;
      flex-shrink:0;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      position:relative;
      overflow:hidden;
    }
    .avatar::after{
      content:"";
      position:absolute; inset:-20px;
      background: radial-gradient(circle at 20% 10%, rgba(255,255,255,.22), transparent 42%);
      pointer-events:none;
    }
    .user .avatar{
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(255,77,141,.70));
      color: white;
      box-shadow: 0 18px 40px rgba(124,92,255,.18);
      border-color: rgba(124,92,255,.35);
    }
    .ai .avatar{
      background: linear-gradient(135deg, rgba(38,214,166,.85), rgba(124,92,255,.75));
      color: white;
      box-shadow: 0 18px 40px rgba(38,214,166,.14);
      border-color: rgba(38,214,166,.30);
    }

    .text{
      flex:1;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: .98rem;
      padding-top: 1px;
      position:relative;
      z-index:1;
    }

    .bubble{
      border-radius: 18px;
      padding: 11px 14px;
      border:1px solid var(--bubble-border);
      background: var(--bubble-bg-ai);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }
    .bubble::before{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(520px 140px at 10% 0%, rgba(124,92,255,.18), transparent 55%),
                  radial-gradient(480px 140px at 90% 10%, rgba(255,77,141,.14), transparent 60%);
      opacity:.55;
      pointer-events:none;
    }
    .message-row.user .bubble{
      background: linear-gradient(180deg, rgba(124,92,255,.18), rgba(255,77,141,.10));
      border-color: rgba(124,92,255,.30);
      box-shadow: 0 18px 50px rgba(124,92,255,.10);
    }
    .message-row.ai .bubble{
      background: linear-gradient(180deg, rgba(38,214,166,.11), rgba(124,92,255,.08));
      border-color: rgba(38,214,166,.22);
      box-shadow: 0 18px 50px rgba(38,214,166,.08);
    }

    /* Code UI blocks */
    .code-block{
      margin: 10px 0;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      overflow:hidden;
      box-shadow: 0 16px 45px rgba(0,0,0,.20);
    }
    html[data-theme="light"] .code-block{
      background: rgba(16,24,40,.04);
      box-shadow: 0 16px 45px rgba(16,24,40,.10);
      border-color: rgba(16,24,40,.10);
    }
    .code-block-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    }
    html[data-theme="light"] .code-block-header{
      border-bottom:1px solid rgba(16,24,40,.08);
      background: rgba(255,255,255,.55);
    }
    .code-lang{
      font-weight: 950;
      font-size: .85rem;
      color: var(--text-main);
      opacity:.95;
      letter-spacing:.2px;
    }
    .code-copy-btn{
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color: var(--text-main);
      border-radius: 12px;
      padding: 7px 10px;
      font-weight: 900;
      cursor:pointer;
      transition: transform .1s ease, background .2s ease, border-color .2s ease;
      font-size: .85rem;
      white-space: nowrap;
    }
    html[data-theme="light"] .code-copy-btn{
      background: rgba(16,24,40,.03);
      border-color: rgba(16,24,40,.10);
    }
    .code-copy-btn:hover{
      background: rgba(255,255,255,.10);
      border-color: rgba(124,92,255,.30);
      transform: translateY(-1px);
    }
    .code-copy-btn:active{ transform: translateY(0px) scale(.99); }

    .code-pre{
      margin:0;
      padding: 12px 12px 14px 12px;
      overflow:auto;
      max-height: 420px;
    }
    .code-pre code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: .92rem;
      line-height: 1.55;
      color: var(--text-main);
      white-space: pre;
    }

    /* Grid Gallery and Individual Image Containers */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 12px;
      width: 100%;
    }

    .image-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 16px 45px rgba(0,0,0,.20);
    }
    html[data-theme="light"] .image-card{
      box-shadow: 0 16px 45px rgba(16,24,40,.10);
      background: rgba(16,24,40,0.02);
    }

    .chat-generated-img {
      width: 100%;
      border-radius: 12px;

  <script>
    const SUPABASE_URL = "https://mxhmcapcmeatnmwiwnri.supabase.co";

    function getErrorMessage(err) {
      if (!err) return 'Unknown error';
      if (typeof err === 'string') return err;
      if (err.message) return err.message;
      if (err.error) return typeof err.error === 'string' ? err.error : JSON.stringify(err.error);
      if (err.details) return err.details;

    function isAuthMissingError(err) { const msg = getErrorMessage(err); const name = (err && err.name) ? String(err.name) : ''; return (msg.toLowerCase().includes('auth session missing') || msg.toLowerCase().includes('session') && msg.toLowerCase().includes('missing') || name.toLowerCase().includes('authsessionmissingerror')); }
    function isRlsOrAuthDenied(err) { const status = err && err.status; const msg = getErrorMessage(err); const code = err && err.code ? String(err.code) : ''; return (status === 401 || status === 403 || msg.includes('JWT') || msg.toLowerCase().includes('rls') || msg.toLowerCase().includes('permission denied') || msg.toLowerCase().includes('not authorized') || code === '42501'); }
    async function getValidSession() { try { const { data: { session } } = await supabaseClient.auth.getSession(); return session; } catch (e) { if (isAuthMissingError(e) || isRlsOrAuthDenied(e)) return null; throw e; } }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    function renderTextWithCodeBlocks(targetEl, text){
      if (!text) { targetEl.innerText = ''; return; }

      const raw = String(text);

      // Split by ```...``` fenced code blocks
      // Supports: ```js ... ``` or ``` ... ```
      const re = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;

      // If no fenced code, fallback
      if (!re.test(raw)) {
        targetEl.innerText = raw;
        return;
      }
      re.lastIndex = 0;

      targetEl.innerHTML = '';
      while ((match = re.exec(raw)) !== null) {
        const before = raw.slice(lastIndex, match.index);
        if (before) {
          const t = document.createElement('div');
          t.style.whiteSpace = 'pre-wrap';
          t.textContent = before;
          targetEl.appendChild(t);
        }

        const lang = (match[1] || 'code').trim() || 'code';
        const code = match[2] ?? '';

        const block = document.createElement('div');
        block.className = 'code-block';

        const header = document.createElement('div');
        header.className = 'code-block-header';

        const langEl = document.createElement('div');
        langEl.className = 'code-lang';
        langEl.innerText = lang;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = 'Copy';
        copyBtn.onclick = async () => {
          try{
            await navigator.clipboard.writeText(code);
            const old = copyBtn.innerText;
            copyBtn.innerText = 'Copied!';
            setTimeout(()=> copyBtn.innerText = old, 900);
          }catch{
            // fallback
            const ta = document.createElement('textarea');
            ta.value = code;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
        };

        header.appendChild(langEl);
        header.appendChild(copyBtn);

        const pre = document.createElement('pre');
        pre.className = 'code-pre';

        const codeEl = document.createElement('code');
        codeEl.innerHTML = escapeHtml(code);

        pre.appendChild(codeEl);

        block.appendChild(header);
        block.appendChild(pre);

        targetEl.appendChild(block);

        lastIndex = re.lastIndex;
      }

      const rest = raw.slice(lastIndex);
      if (rest) {
        const t = document.createElement('div');
        t.style.whiteSpace = 'pre-wrap';
        t.textContent = rest;
        targetEl.appendChild(t);
      }
    }

    window.onload = async () => {
      setTheme(THEME_DEFAULT, true);

      try {

        if (!session) { setAuthModalVisible(true); setAuthMode('login'); resetStateForLogout(); clearChatUI(); return; }
        await hydrateUserAndLoadChats(session.user);

        console.error('Init error:', err); setAuthMode('login'); resetStateForLogout(); clearChatUI(); setAuthModalVisible(true);
      }
    };

    function setTheme(theme, silent = false){
      const root = document.documentElement;
      const mode = theme === 'light' || theme === 'dark' ? theme : 'dark';
      root.setAttribute('data-theme', mode);
      themeLightBtn.classList.toggle('active', mode === 'light');
      themeDarkBtn.classList.toggle('active', mode === 'dark');
      void silent;
    }

    function openSettings(){ settingsModal.style.display = 'flex'; }

      if (e.key === 'Escape'){ settingsModal.style.display = 'none'; authModal.style.display = 'none'; imageModal.style.display = 'none'; }
    });

    imageModal.addEventListener('click', (e) => { if (e.target === imageModal) closeImageModal(); });

    function toggleSidebar() { const isOpen = sidebar.classList.contains('open'); if (isOpen) { sidebar.classList.remove('open'); overlay.style.display = 'none'; } else { sidebar.classList.add('open'); overlay.style.display = 'block'; } }
    function setAuthMode(mode){
      authMode = mode;
      const isLogin = mode === 'login';
      modeLoginBtn.classList.toggle('active', isLogin);
      modeSignupBtn.classList.toggle('active', !isLogin);
      authTitle.innerText = isLogin ? 'Sign in' : 'Create account';
      authActionBtn.innerText = isLogin ? 'Sign in' : 'Create account';
      usernameInput.style.display = isLogin ? 'none' : 'block';
    }

    async function signUp(email, password, username) { try { const { data, error } = await supabaseClient.auth.signUp({ email, password }); if (error) { alert(getErrorMessage(error)); return; } const userId = data?.user?.id; if (!userId) { alert("Sign up succeeded, but user id was not returned."); return; } const { error: insertErr } = await supabaseClient.from("profiles").upsert({ id: userId, username: username }, { onConflict: 'id' }); if (insertErr) console.warn('Profile upsert error:', getErrorMessage(insertErr)); alert("Account created successfully!"); const { data: { session } } = await supabaseClient.auth.getSession(); if (session?.user) { await hydrateUserAndLoadChats(session.user); setAuthModalVisible(false); } else { setAuthMode('login'); setAuthModalVisible(true); } } catch (err) { console.error('Sign up error:', err); alert('Sign up failed. Please try again.'); } }
    async function login(email, password) { try { const { error } = await supabaseClient.auth.signInWithPassword({ email, password }); if (error) { alert(getErrorMessage(error)); return; } const { data: { session } } = await supabaseClient.auth.getSession(); if (!session?.user) { setAuthMode('login'); setAuthModalVisible(true); return; } await hydrateUserAndLoadChats(session.user); setAuthModalVisible(false); } catch (err) { console.error('Login error:', err); alert('Login failed. Please try again.'); } }
    async function handleAuth() { const email = (emailInput.value || '').trim(); const password = (passwordInput.value || '').trim(); const username = (usernameInput.value || '').trim(); if (!email) return alert("Please enter your email."); if (!password) return alert("Please enter your password."); if (authMode === 'signup') { if (!username) return alert("Please enter your username."); await signUp(email, password, username); } else { await login(email, password); } }
    async function logout() { try { await supabaseClient.auth.signOut(); } catch (e) { console.warn('Sign out error:', e); } finally { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); } }

    function randomSessionId() { if (crypto?.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; const v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); }
    function formatMaybeDateMs(dateVal){ if (!dateVal) return 0; try{ const t = new Date(dateVal).getTime(); return Number.isFinite(t) ? t : 0; }catch{ return 0; } }
    function getChatTitleFromMessages(messages){ const firstUser = (messages || []).find(m => m.role === 'user' && (m.content || '').trim()); if (!firstUser) return 'New Chat'; const t = (firstUser.content || '').trim(); return t.length > 22 ? t.substring(0, 22) + '...' : t; }
    function appendErrorUI(text) { const existing = chatContainer.querySelector('.error-message'); if (existing) existing.remove(); const div = document.createElement('div'); div.className = 'error-message'; div.innerText = text; chatContainer.appendChild(div); chatContainer.scrollTop = chatContainer.scrollHeight; }

    async function ensureProfileForUser(user) { const userId = user?.id; if (!userId) return; const unameFallback = user.email?.split('@')[0] || 'User'; try { const { data: profile, error } = await supabaseClient.from('profiles').select('username').eq('id', userId).maybeSingle(); if (error) console.warn('Profile select error:', getErrorMessage(error)); if (!profile) { const toInsert = { id: userId, username: unameFallback }; const { error: upsertErr } = await supabaseClient.from('profiles').upsert(toInsert, { onConflict: 'id' }); if (upsertErr) console.warn('Profile upsert error:', getErrorMessage(upsertErr)); } return profile || { username: unameFallback }; } catch (err) { console.warn('ensureProfileForUser error:', err); return { username: unameFallback }; } }

    async function hydrateUserAndLoadChats(user) {
      if (!user?.id) return;
      currentUserId = user.id;
      currentUser = null;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session?.user) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); return; }
      } catch (e) {
        if (isAuthMissingError(e) || isRlsOrAuthDenied(e)) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); return; }
      }
      const profile = await ensureProfileForUser(user);
      const uname = profile?.username || user.email?.split('@')[0] || 'User';
      currentUser = uname;
      document.getElementById('userDisplay').innerText = currentUser;
      setAuthModalVisible(false);
      await loadAllChatsFromSupabase();
      if (!Object.keys(userSessions).length) createNewChat(true);
      else {
        const sessionIds = Object.keys(userSessions).sort((a, b) => {
          const ta = Number(userSessions[a]?.lastCreatedAtMs || 0);
          const tb = Number(userSessions[b]?.lastCreatedAtMs || 0);

        });
        currentSessionId = sessionIds[0] || null;

      }
    }

    async function loadAllChatsFromSupabase() {
      userSessions = {};
      currentSessionId = null;
      try {
        const { data: rows, error } = await supabaseClient.from('chats').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true });
        if (error) throw error;
        if (!rows) return;
        for (const row of rows) {
          const sessionId = row.session_id;
          if (!sessionId) continue;
          if (!userSessions[sessionId]) {
            userSessions[sessionId] = { title: 'Chat', messages: [], createdAtMs: formatMaybeDateMs(row.created_at), lastCreatedAtMs: formatMaybeDateMs(row.created_at) };
          }
          const createdAtMs = formatMaybeDateMs(row.created_at);
          userSessions[sessionId].lastCreatedAtMs = Math.max(userSessions[sessionId].lastCreatedAtMs || 0, createdAtMs);
          const exists = userSessions[sessionId].messages.some(m => m.role === row.role && m.content === row.message && Number(m.createdAtMs) === createdAtMs);
          if (exists) continue;

          if (row.role === 'system') userSessions[sessionId].messages.push({ role: 'system', content: row.message, createdAtMs });
          else if (row.role === 'user') {
            userSessions[sessionId].messages.push({ role: 'user', content: row.message, createdAtMs });
            if (userSessions[sessionId].title === 'Chat') userSessions[sessionId].title = getChatTitleFromMessages(userSessions[sessionId].messages);
          }
          else if (row.role === 'assistant') userSessions[sessionId].messages.push({ role: 'assistant', content: row.message, createdAtMs });
          else userSessions[sessionId].messages.push({ role: row.role, content: row.message, createdAtMs });
        }
        for (const sid of Object.keys(userSessions)) userSessions[sid].title = getChatTitleFromMessages(userSessions[sid].messages);
      } catch (err) {
        console.error('Load chats error:', err);
        if (isAuthMissingError(err) || isRlsOrAuthDenied(err)) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); return; }
        appendErrorUI('❌ Failed to load your chat history. Please try again.');
        userSessions = {};
      }
    }

    function createNewChat(silent = false) {
      currentSessionId = randomSessionId();
      userSessions[currentSessionId] = { title: 'New Chat', messages: [{ role: 'system', content: DEFAULT_SYSTEM_PROMPT, createdAtMs: Date.now() }], createdAtMs: Date.now(), lastCreatedAtMs: Date.now() };
      if (!silent) {
        renderHistorySidebar();
        renderActiveChat();
        if (window.innerWidth < 768) toggleSidebar();
      }
    }

    function renderHistorySidebar() {
      historyList.innerHTML = '';
      const sessionIds = Object.keys(userSessions).sort((a, b) => (Number(userSessions[b]?.createdAtMs || 0) - Number(userSessions[a]?.createdAtMs || 0)));

      if (!sessionIds.length) {
        const emptyDiv = document.createElement('div');
        emptyDiv.style.cssText = 'text-align:center;color:var(--text-sub);padding:20px;font-size:.9rem;';
        emptyDiv.innerText = 'No chats yet. Start a new conversation!';
        historyList.appendChild(emptyDiv);
        return;
      }

      sessionIds.forEach((id) => {
        const session = userSessions[id];
        const item = document.createElement('div');
        item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
        item.style.position = 'relative';

        const title = session?.title ?? 'Chat';
        const userCount = (session?.messages || []).filter(m => m.role === 'user').length;

        const left = document.createElement('span');
        left.style.minWidth = '0';
        left.style.overflow = 'hidden';
        left.style.textOverflow = 'ellipsis';
        left.style.whiteSpace = 'nowrap';
        left.style.flex = '1';
        left.innerText = title;

        const right = document.createElement('div');
        right.style.display = 'flex';
        right.style.alignItems = 'center';
        right.style.gap = '8px';
        right.style.flexShrink = '0';

        const pill = document.createElement('span');
        pill.innerText = userCount ? `${userCount} msg` : 'Empty';
        pill.style.cssText = `
          padding: 6px 10px;
          border-radius: 999px;
          font-weight: 900;
          font-size: .78rem;
          color: var(--text-main);
          background: linear-gradient(135deg, rgba(124,92,255,.16), rgba(38,214,166,.10));
          border: 1px solid rgba(124,92,255,.22);
        `;

        const deleteBtn = document.createElement('button');
        deleteBtn.innerHTML = '×';
        deleteBtn.style.cssText = `
          background: transparent; border: none; color: var(--text-sub);
          font-size: 1.2rem; cursor: pointer; padding: 4px 6px;
          border-radius: 6px; transition: all 0.2s ease; line-height: 1;
          display: flex; align-items: center; justify-content: center;
          width: 24px; height: 24px;
        `;
        deleteBtn.onmouseenter = () => { deleteBtn.style.color = 'var(--danger)'; };
        deleteBtn.onmouseleave = () => { deleteBtn.style.color = 'var(--text-sub)'; };
        deleteBtn.onclick = (e) => { e.stopPropagation(); deleteChat(id); };

        right.appendChild(pill);
        right.appendChild(deleteBtn);
        item.appendChild(left);
        item.appendChild(right);

        item.onclick = () => switchSession(id);
        historyList.appendChild(item);
      });
    }

    async function deleteChat(sessionId) {
      if (!sessionId) return;
      const session = userSessions[sessionId];
      const title = session?.title || 'Chat';
      if (!confirm(`Delete \"${title}\"? This action cannot be undone.`)) return;

      try {
        const { error } = await supabaseClient.from('chats').delete().eq('user_id', currentUserId).eq('session_id', sessionId);
        if (error) { alert('Failed to delete chat.'); return; }
        delete userSessions[sessionId];
        if (currentSessionId === sessionId) {
          const sessionIds = Object.keys(userSessions);
          if (sessionIds.length > 0) {
            currentSessionId = sessionIds[0];
            await loadSessionMessagesFromSupabase(currentSessionId);
          } else createNewChat(true);
        }
        renderHistorySidebar();
        renderActiveChat();
      } catch (err) { console.error('Delete chat error:', err); }
    }

    async function switchSession(id) { currentSessionId = id; await loadSessionMessagesFromSupabase(id); renderHistorySidebar(); renderActiveChat(); if (window.innerWidth < 768) toggleSidebar(); }

    async function loadSessionMessagesFromSupabase(sessionId) {
      if (!currentUserId) return;
      try {
        const { data: rows, error } = await supabaseClient.from('chats').select('*').eq('user_id', currentUserId).eq('session_id', sessionId).order('created_at', { ascending: true });
        if (error) throw error;
        if (!rows || rows.length === 0) return;
        const messages = rows.map(r => ({ role: r.role, content: r.message, createdAtMs: formatMaybeDateMs(r.created_at) }));
        if (!userSessions[sessionId]) userSessions[sessionId] = { title: 'Chat', messages: [], createdAtMs: Date.now() };
        userSessions[sessionId].messages = messages;
        userSessions[sessionId].title = getChatTitleFromMessages(messages);
      } catch (err) { console.error('Load session error:', err); }
    }

    function renderActiveChat() {
      chatContainer.innerHTML = '';
      const session = userSessions[currentSessionId];
      if (!session) return;
      session.messages.forEach((msg) => {
        if (msg.role !== 'system') appendMessageUI(msg.role === 'user' ? 'user' : 'ai', msg.content, false);
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function downloadIndividualImage(url, index) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `generated-image-${index + 1}-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) { window.open(url, '_blank'); }
    }

    function appendMessageUI(role, text, doScroll = true) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const content = document.createElement('div');
      content.className = 'message-content';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = role === 'user' ? 'You' : 'YF';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const textDiv = document.createElement('div');
      textDiv.className = 'text';

      if (text && text.trim() === '__TYPING__') {
        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.innerHTML = '<span></span><span></span><span></span>';
        textDiv.appendChild(typing);
      } else if (text && text.startsWith('IMAGE_GRID:')) {
        const rawJson = text.replace('IMAGE_GRID:', '').trim();
        try {
          const payload = JSON.parse(rawJson);
          textDiv.innerHTML = `<div>Generated ${payload.urls.length} Image(s) for \"${payload.prompt}\":</div>`;
          const grid = document.createElement('div');
          grid.className = 'image-grid';
          payload.urls.forEach((url, idx) => {
            const card = document.createElement('div');
            card.className = 'image-card';

            const img = document.createElement('img');
            img.src = url;
            img.className = 'chat-generated-img';
            img.alt = payload.prompt;
            img.onclick = () => window.open(url, '_blank');

            const dlBtn = document.createElement('button');
            dlBtn.className = 'dl-img-btn';
            dlBtn.innerHTML = '⬇️ Download Image';
            dlBtn.onclick = (e) => { e.stopPropagation(); downloadIndividualImage(url, idx); };

            card.appendChild(img);
            card.appendChild(dlBtn);
            grid.appendChild(card);
          });
          textDiv.appendChild(grid);
        } catch(e) { textDiv.innerText = text; }
      } else {
        // NEW: render fenced code blocks automatically
        renderTextWithCodeBlocks(textDiv, text || '');
      }

      bubble.appendChild(textDiv);
      content.appendChild(avatar);
      content.appendChild(bubble);
      row.appendChild(content);
      chatContainer.appendChild(row);

      if (doScroll) chatContainer.scrollTop = chatContainer.scrollHeight;
      return textDiv;
    }

    function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; }

    async function processImageGeneration(rawPrompt, count = 1, dimensions = "1024x1024", styleModifier = "photorealistic") {
      let prompt = rawPrompt.trim();
      const currentSession = userSessions[currentSessionId];

      if (currentSession.title === 'New Chat' || currentSession.title === 'Chat') {
        currentSession.title = "🎨 Image: " + (prompt.length > 15 ? prompt.substring(0, 15) + '...' : prompt);
      }

      appendMessageUI('user', `/image ${prompt}`);
      userInput.value = '';
      userInput.style.height = 'auto';

      try { await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'user', message: `/image ${prompt}`, created_at: new Date().toISOString() }); } catch (dbErr) { console.warn('DB save warning:', dbErr); }
      currentSession.messages.push({ role: 'user', content: `/image ${prompt}`, createdAtMs: Date.now() });

      const aiTextNode = appendMessageUI('ai', `🎨 Generating ${count} high-resolution image(s)...`);

      let enhancedPrompt = prompt;
      if (styleModifier === 'photorealistic') enhancedPrompt += ", highly detailed photograph, 8k resolution, raw photo, ultra-realistic DSLR shot, natural sharp lighting, fine texture, unedited portrait";
      else if (styleModifier === 'cinematic') enhancedPrompt += ", cinematic film shot, IMAX 35mm lens, atmospheric depth, photo, realistic shot";
      else if (styleModifier) enhancedPrompt += `, in ${styleModifier} style`;

      const [width, height] = dimensions.split('x');
      const imageUrls = [];

      for (let i = 0; i < count; i++) {
        const seed = Math.floor(Math.random() * 9000000) + 1000000;
        const encodedPrompt = encodeURIComponent(enhancedPrompt);
        const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&enhance=true`;
        imageUrls.push(url);
      }

      const payloadObj = { prompt: prompt, urls: imageUrls };
      const imagePayload = `IMAGE_GRID:${JSON.stringify(payloadObj)}`;

      aiTextNode.innerHTML = `<div>Generated ${count} Realistic Image(s) for \"${prompt}\":</div>`;
      const grid = document.createElement('div');
      grid.className = 'image-grid';
      imageUrls.forEach((url, idx) => {
        const card = document.createElement('div');
        card.className = 'image-card';

        const img = document.createElement('img');
        img.src = url;
        img.className = 'chat-generated-img';
        img.alt = prompt;
        img.onclick = () => window.open(url, '_blank');

        const dlBtn = document.createElement('button');
        dlBtn.className = 'dl-img-btn';
        dlBtn.innerHTML = '⬇️ Download Image';
        dlBtn.onclick = (e) => { e.stopPropagation(); downloadIndividualImage(url, idx); };

        card.appendChild(img);
        card.appendChild(dlBtn);
        grid.appendChild(card);
      });
      aiTextNode.appendChild(grid);

      try { await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'assistant', message: imagePayload, created_at: new Date().toISOString() }); } catch (dbErr) { console.warn('DB save warning:', dbErr); }
      currentSession.messages.push({ role: 'assistant', content: imagePayload, createdAtMs: Date.now() });

      renderHistorySidebar();
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function generateImageFromModal() {
      const prompt = document.getElementById('imgPromptInput').value.trim();
      const count = parseInt(document.getElementById('imgCountSelect').value, 10) || 1;
      const ratio = document.getElementById('imgRatioSelect').value;
      const style = document.getElementById('imgStyleSelect').value;

      if (!prompt) return alert('Please enter an image prompt.');

      closeImageModal();
      document.getElementById('imgPromptInput').value = '';

      await processImageGeneration(prompt, count, ratio, style);
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || !currentSessionId) return;
      if (sendInFlight) return;

      if (text.startsWith('/image')) {
        const prompt = text.replace('/image', '').trim();
        if (!prompt) return alert('Please provide a prompt after /image (e.g. /image realistic lion in savanna)');
        await processImageGeneration(prompt, 2, "1024x1024", "photorealistic");
        return;
      }

      sendInFlight = true;
      sendBtn.disabled = true;
      let aiTextNode = null;

      try {
        const session = await getValidSession();
        if (!session?.user) { resetStateForLogout(); clearChatUI(); setAuthMode('login'); setAuthModalVisible(true); sendBtn.disabled = false; sendInFlight = false; return; }
        currentUserId = session.user.id;

        const currentSession = userSessions[currentSessionId];
        if (!currentSession) { createNewChat(true); return; }

        if (currentSession.title === 'New Chat' || currentSession.title === 'Chat') {
          currentSession.title = text.length > 22 ? text.substring(0, 22) + '...' : text;
        }

        appendMessageUI('user', text);
        userInput.value = '';
        userInput.style.height = 'auto';

        try { await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'user', message: text, created_at: new Date().toISOString() }); } catch (dbErr) { console.warn('DB save warning:', dbErr); }
        currentSession.messages.push({ role: 'user', content: text, createdAtMs: Date.now() });

        aiTextNode = appendMessageUI('ai', '__TYPING__');

        let aiMessages = currentSession.messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }));
        aiMessages = aiMessages.map(msg => (msg.content && msg.content.length > 1000 ? { ...msg, content: msg.content.substring(0, 1000) + '... [truncated]' } : msg));
        if (aiMessages.length > 10) aiMessages = aiMessages.slice(-10);

        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: aiMessages, model: "llama-3.3-70b-versatile", temperature: 0.7, max_tokens: 1024 })
        });

        if (!response.ok) {
          const errorText = await response.text();
          let errorMsg;
          try {
            const errorJson = JSON.parse(errorText);
            errorMsg = errorJson?.error?.message || errorJson?.error || errorJson?.message || `HTTP ${response.status}`;
          } catch { errorMsg = errorText || `HTTP ${response.status}`; }
          throw new Error(errorMsg);
        }

        const data = await response.json();
        const reply = data?.choices?.[0]?.message?.content;
        if (!reply) throw new Error('AI response missing content');

        try { await supabaseClient.from('chats').insert({ session_id: currentSessionId, user_id: currentUserId, role: 'assistant', message: reply, created_at: new Date().toISOString() }); } catch (dbErr) { console.warn('DB save warning:', dbErr); }
        currentSession.messages.push({ role: 'assistant', content: reply, createdAtMs: Date.now() });
        currentSession.lastCreatedAtMs = Date.now();

        if (aiTextNode) renderTextWithCodeBlocks(aiTextNode, reply);

        renderHistorySidebar();
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } catch (err) {
        let errorMsg = err?.message || String(err);
        if (aiTextNode) { aiTextNode.innerText = '❌ ' + errorMsg; aiTextNode.style.color = 'var(--danger)'; }
        else appendErrorUI('❌ ' + errorMsg);
      } finally {
        sendInFlight = false;
        sendBtn.disabled = false;
      }
    }

    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    window.createNewChat = createNewChat;
    window.toggleSidebar = toggleSidebar;
    window.openSettings = openSettings;
    window.closeSettings = closeSettings;
    window.openImageModal = openImageModal;
    window.closeImageModal = closeImageModal;
    window.generateImageFromModal = generateImageFromModal;
    window.setAuthMode = setAuthMode;
    window.setTheme = setTheme;
    window.logout = logout;
    window.handleAuth = handleAuth;
    window.sendMessage = sendMessage;
    window.deleteChat = deleteChat;
    window.downloadIndividualImage = downloadIndividualImage;
  </script>
</body>
</html>
