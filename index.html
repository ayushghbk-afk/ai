<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Your Friend - AI Assistant</title>
  <style>
    :root {
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-card-user: #2f2f2f;
      --bg-input: #2f2f2f;
      --text-main: #ececec;
      --text-sub: #b4b4b4;
      --border-color: #333333;
      --accent-color: #f55036;
      --accent-hover: #d44028;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 90;
    }

    #auth-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-sidebar);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }

    .auth-card input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
      font-size: 1rem;
    }

    .auth-card button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent-color);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    aside {
      width: 260px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-right: 1px solid var(--border-color);
      flex-shrink: 0;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    @media (min-width: 768px) {
      aside {
        position: relative;
        transform: translateX(0) !important;
      }
      #sidebar-overlay {
        display: none !important;
      }
      .menu-btn {
        display: none !important;
      }
    }

    aside.open {
      transform: translateX(0);
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      margin-top: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 12px;
      font-size: 0.9rem;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item.active, .history-item:active {
      background: var(--bg-card-user);
      color: var(--text-main);
    }

    .user-profile {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #ff5555;
      cursor: pointer;
      padding: 6px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    header {
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 4px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
    }

    .message-row {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 12px 16px;
    }

    .message-content {
      width: 100%;
      max-width: 768px;
      display: flex;
      gap: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .user .avatar { background-color: #5436da; color: white; }
    .ai .avatar { background-color: var(--accent-color); color: white; }

    .text {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      padding-top: 3px;
    }

    .message-row.user .text {
      background-color: var(--bg-card-user);
      padding: 8px 14px;
      border-radius: 16px;
      display: inline-block;
      max-width: 85%;
    }

    footer {
      padding: 8px 12px 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg-main);
    }

    .input-container {
      width: 100%;
      max-width: 768px;
      background-color: var(--bg-input);
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border: 1px solid var(--border-color);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      height: 24px;
      padding: 2px 0;
    }

    .send-btn {
      background-color: var(--text-main);
      color: var(--bg-main);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-weight: bold;
    }

    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .error-message {
      color: #ff6b6b;
      padding: 8px 12px;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 8px;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <!-- Auth Modal -->
  <div id="auth-modal">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <input type="text" id="username" placeholder="Enter your name" />
      <button onclick="handleAuth()">Start Talking</button>
    </div>
  </div>

  <!-- Mobile Overlay -->
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Responsive Sidebar -->
  <aside id="sidebar">
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>
    <div class="history-list" id="historyList"></div>
    <div class="user-profile">
      <span id="userDisplay">User</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main>
    <header>
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span>Your Friend</span>
    </header>

    <div id="chat-container"></div>

    <footer>
      <div class="input-container">
        <textarea id="userInput" placeholder="Message Your Friend..." rows="1" oninput="autoResize(this)"></textarea>
        <button id="sendBtn" class="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </footer>
  </main>

  <script>
    // ============================================================
    // 🔐 SECURE: API key is hidden in Cloudflare Worker
    // Your Cloudflare Worker URL (already deployed!)
    // ============================================================
    const PROXY_URL = 'https://groq-proxy.mr-hackerdon808.workers.dev/api/chat';

    let currentUser = null;
    let currentSessionId = null;
    let userSessions = {}; 

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const authModal = document.getElementById('auth-modal');
    const usernameInput = document.getElementById('username');
    const historyList = document.getElementById('historyList');
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // ============================================================
    // AUTHENTICATION
    // ============================================================

    window.onload = () => {
      const savedUser = localStorage.getItem('logged_user');
      if (savedUser) loginUser(savedUser);
    };

    function toggleSidebar() {
      const isOpen = sidebar.classList.contains('open');
      if (isOpen) {
        sidebar.classList.remove('open');
        overlay.style.display = 'none';
      } else {
        sidebar.classList.add('open');
        overlay.style.display = 'block';
      }
    }

    function handleAuth() {
      const name = usernameInput.value.trim();
      if (!name) return alert("Please enter your name.");
      loginUser(name);
    }

    function loginUser(name) {
      currentUser = name;
      localStorage.setItem('logged_user', currentUser);
      document.getElementById('userDisplay').innerText = currentUser;
      authModal.style.display = 'none';

      const storedData = localStorage.getItem(`yf_sessions_${currentUser}`);
      userSessions = storedData ? JSON.parse(storedData) : {};

      const sessionKeys = Object.keys(userSessions);
      if (sessionKeys.length > 0) {
        currentSessionId = sessionKeys[sessionKeys.length - 1];
        renderHistorySidebar();
        renderActiveChat();
      } else {
        createNewChat();
      }
    }

    function logout() {
      localStorage.removeItem('logged_user');
      location.reload();
    }

    // ============================================================
    // SESSION MANAGEMENT
    // ============================================================

    function saveSessionsToStorage() {
      if (currentUser) {
        localStorage.setItem(`yf_sessions_${currentUser}`, JSON.stringify(userSessions));
      }
    }

    function createNewChat() {
      if (currentSessionId && userSessions[currentSessionId] && userSessions[currentSessionId].messages.length <= 1) {
        if (window.innerWidth < 768) toggleSidebar();
        return;
      }

      currentSessionId = 'session_' + Date.now();
      userSessions[currentSessionId] = {
        title: 'New Chat',
        messages: [{ role: 'system', content: 'You are a helpful, warm, and smart companion named Your Friend.' }]
      };

      saveSessionsToStorage();
      renderHistorySidebar();
      renderActiveChat();
      if (window.innerWidth < 768) toggleSidebar();
    }

    function renderHistorySidebar() {
      historyList.innerHTML = '';
      const sessionIds = Object.keys(userSessions).reverse();

      sessionIds.forEach(id => {
        const session = userSessions[id];
        const item = document.createElement('div');
        item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
        item.innerText = session.title;
        item.onclick = () => switchSession(id);
        historyList.appendChild(item);
      });
    }

    function switchSession(id) {
      currentSessionId = id;
      renderHistorySidebar();
      renderActiveChat();
      if (window.innerWidth < 768) toggleSidebar();
    }

    function renderActiveChat() {
      chatContainer.innerHTML = '';
      const session = userSessions[currentSessionId];
      if (!session) return;

      session.messages.forEach(msg => {
        if (msg.role !== 'system') {
          appendMessageUI(msg.role === 'user' ? 'user' : 'ai', msg.content);
        }
      });
    }

    // ============================================================
    // UI HELPERS
    // ============================================================

    function appendMessageUI(role, text) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const content = document.createElement('div');
      content.className = 'message-content';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = role === 'user' ? 'You' : 'YF';

      const textDiv = document.createElement('div');
      textDiv.className = 'text';
      textDiv.innerText = text;

      content.appendChild(avatar);
      content.appendChild(textDiv);
      row.appendChild(content);

      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return textDiv;
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    // ============================================================
    // 🔑 MAIN CHAT FUNCTION - SECURE VERSION
    // ============================================================

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || !currentSessionId) return;

      const currentSession = userSessions[currentSessionId];

      if (currentSession.title === 'New Chat') {
        currentSession.title = text.length > 22 ? text.substring(0, 22) + '...' : text;
        renderHistorySidebar();
      }

      appendMessageUI('user', text);
      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;

      currentSession.messages.push({ role: 'user', content: text });
      saveSessionsToStorage();

      const aiTextNode = appendMessageUI('ai', 'Thinking...');

      try {
        // 🛡️ API call goes to YOUR CLOUDFLARE WORKER, NOT directly to Groq
        // The worker adds the API key securely on the server side
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            messages: currentSession.messages,
            model: "llama-3.3-70b-versatile",
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0]) {
          const reply = data.choices[0].message.content;
          aiTextNode.innerText = reply;
          currentSession.messages.push({ role: 'assistant', content: reply });
          saveSessionsToStorage();
        } else {
          // Handle errors from the worker or Groq
          const errorMsg = data.error || "Failed to get response.";
          aiTextNode.innerText = "❌ " + errorMsg;
          aiTextNode.style.color = '#ff6b6b';
          console.error('API Error:', data);
        }
      } catch (err) {
        console.error('Network Error:', err);
        aiTextNode.innerText = "❌ Network error. Please check your connection and try again.";
        aiTextNode.style.color = '#ff6b6b';
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ============================================================
    // 🧪 TEST: Check if Cloudflare Worker is reachable
    // ============================================================

    async function testWorkerConnection() {
      try {
        const response = await fetch('https://groq-proxy.mr-hackerdon808.workers.dev/', {
          method: 'GET',
        });
        const data = await response.json();
        console.log('✅ Cloudflare Worker is running:', data);
        return true;
      } catch (error) {
        console.warn('⚠️ Worker health check failed:', error.message);
        return false;
      }
    }

    // Run test after load
    window.addEventListener('load', () => {
      setTimeout(testWorkerConnection, 1000);
    });
  </script>
</body>
  </html>
